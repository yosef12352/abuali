<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#150e20"><title>الأصدقاء — أبو علي شات</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 15% 0%,#352047,transparent 55%),#100d17;color:#f7f0ff;font:15px system-ui,Tahoma,sans-serif}main{max-width:720px;margin:auto;padding:18px 14px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0 22px}h1{font-size:25px;margin:0}a{color:#e7c884;text-decoration:none}button,input{font:inherit}button{border:1px solid #9c815c;background:linear-gradient(120deg,#d6b879,#ae8c51);color:#1d1420;border-radius:13px;padding:11px 14px;cursor:pointer;font-weight:700}button.secondary{background:#2a2135;color:#f4e5fa;border-color:#53405e}button:disabled{opacity:.45;cursor:not-allowed}.tabs{display:flex;gap:8px;overflow:auto;padding:5px 0 18px}.tabs button{white-space:nowrap;flex:1}.tabs button[aria-selected=false]{background:#251b30;color:#d3bfdc;border-color:#45324f}.search{display:flex;gap:9px;margin-bottom:18px}.search input{width:100%;min-width:0;background:#221b2d;border:1px solid #614e6d;border-radius:14px;padding:14px;color:white;outline:none}.card{display:flex;gap:13px;align-items:center;background:linear-gradient(145deg,#271e33,#1b1626);border:1px solid #56405d;border-radius:19px;padding:14px;margin:11px 0;box-shadow:0 12px 24px #0003}.avatar{flex:0 0 52px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#473456;color:#f6dca5;overflow:hidden;font-size:22px}.avatar.online{border:3px solid #35d58d;animation:presence-pulse 2.6s ease-in-out infinite}.avatar.offline{border:3px solid #d95365}.avatar.unknown{border:3px solid #786b81}@keyframes presence-pulse{0%,100%{box-shadow:0 0 0 0 #35d58d33}50%{box-shadow:0 0 0 6px #35d58d00}}@media(prefers-reduced-motion:reduce){.avatar.online{animation:none}}.avatar img{width:100%;height:100%;object-fit:contain;object-position:center;background:#473456}.person{flex:1;min-width:0}.person strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person small{color:#c2aecb}.actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.actions button{font-size:12px;padding:9px}#feedback{min-height:28px;color:#e7cb93}#list:empty:after{content:'ما في نتائج حالياً';display:block;text-align:center;padding:40px;color:#bba7c6}.hint{color:#bda9c7;font-size:12px;line-height:1.8}.cover{height:95px;border-radius:15px;background:linear-gradient(110deg,#392449,#97754d,#261c36);margin:12px 0}@media(max-width:500px){.card{align-items:flex-start;flex-wrap:wrap}.actions{width:100%}.actions button{flex:1}}

/* Mobile polish: 8px rhythm and accessible touch targets */
body{font-size:16px}main{padding:16px 16px 88px}.card{gap:16px;padding:16px;margin:16px 0}.tabs button,.actions button,#refreshFriends{min-height:44px}.search input{font-size:16px;min-height:48px}.avatar{flex-basis:56px;width:56px;height:56px}.person small{font-size:14px;line-height:1.5}.card,.avatar,button{transition:transform .18s ease,background-color .18s ease}button:active{transform:scale(.97)}button:focus-visible,a:focus-visible{outline:3px solid #f2d49b;outline-offset:3px}@media(prefers-reduced-motion:reduce){.card,.avatar,button{transition:none!important}}@media(max-width:500px){.card{gap:12px}.actions{gap:8px}}
.group-setup{margin:16px 0;padding:18px;border:1px solid #d3b97b66;border-radius:20px;background:linear-gradient(145deg,#30233b,#18252e);color:#f9e4bd}.group-setup h2{font-size:19px;margin:0 0 10px}.group-setup button{min-height:44px}.group-setup .hint{line-height:1.7}.group-choice{display:flex;align-items:center;gap:12px;padding:11px;border-bottom:1px solid #ffffff22}.group-choice input{width:21px;height:21px;accent-color:#e4bd79}.group-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}#groupPicker[hidden]{display:none!important}</style><link rel="icon" type="image/svg+xml" href="./icon.svg"></head><body><main>
<header><div><h1>الأصدقاء <span aria-hidden="true">✦</span></h1><div class="hint">تواصل بأمان مع الأشخاص اللي بتعرفهم</div></div><a href="./index.html">العودة للدردشات</a></header>
<div class="cover" aria-hidden="true"></div><section id="groupCallSetup" class="group-setup" aria-labelledby="groupCallTitle"><h2 id="groupCallTitle">👥 مكالمة جماعية</h2><p class="hint">اختار من أصدقائك لغاية 7 أشخاص. اتصل صوت أو فيديو مع أصدقائك. يمكن لكل مشارك إضافة أصدقائه حتى 8 أشخاص بالمجموع.</p><button type="button" id="groupSelectFriends">اختيار المشاركين</button><div id="groupIncoming" aria-live="polite"></div><div id="groupPicker" hidden><div id="groupFriendChoices"></div><div class="group-actions"><button type="button" id="groupInviteAudio">تحضير دعوة صوتية</button><button type="button" id="groupInviteVideo">تحضير دعوة فيديو</button></div><p id="groupFeedback" role="status" aria-live="polite"></p></div></section>
<div class="tabs" role="tablist" aria-label="قوائم الأصدقاء"><button type="button" data-tab="discover" aria-selected="true">اكتشف</button><button type="button" data-tab="incoming" aria-selected="false">الواردة</button><button type="button" data-tab="outgoing" aria-selected="false">المرسلة</button><button type="button" data-tab="friends" aria-selected="false">أصدقائي</button></div>
<form id="searchForm" class="search"><input id="search" maxlength="60" placeholder="ابحث باسم المستخدم" aria-label="بحث عن مستخدم"><button type="submit">بحث</button></form>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><p id="feedback" role="status" aria-live="polite"></p><button id="refreshFriends" class="secondary" type="button" aria-label="تحديث الأصدقاء">↻ تحديث</button></div><div id="list"></div>
<p class="hint">للمراسلة الفردية افتح ملف الصديق واضغط «رسالة».</p>
</main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://xgoggkcwmagghkdzvjqz.supabase.co','sb_publishable_MUJZT-WcsKGC3JH3IwtJSA_9jZOnhsT',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let me=null,tab='discover',relations=[],profiles=[];let presence=new Map();const avatarCache=new Map();
const list=document.getElementById('list'),feedback=document.getElementById('feedback'),search=document.getElementById('search');
const setStatus=s=>feedback.textContent=s;
const blocked=new Set();
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
async function load(){
 const {data:{user},error:authError}=await db.auth.getUser();
 if(authError||!user){location.href='./account.html';return}me=user.id;
 setStatus('جارٍ تحميل الأصدقاء...');
 const [rs,bs]=await Promise.all([
 db.from('chat_friendships').select('id,requester_id,addressee_id,status,created_at').or('requester_id.eq.'+me+',addressee_id.eq.'+me),
 db.from('user_blocks').select('blocked_id').eq('blocker_id',me)
 ]);
 if(rs.error){setStatus('تعذّر تحميل العلاقات: '+rs.error.message);return}
 relations=rs.data||[];blocked.clear();for(const b of bs.data||[])blocked.add(b.blocked_id);
 await refreshProfiles();if(!feedback.textContent.startsWith('تعذّر'))setStatus('');
}
async function refreshProfiles(){
 const q=search.value.trim();
 const {data,error}=await db.rpc('chat_discover_people',{p_search:q,p_limit:50});
 if(error){setStatus('تعذّر تحميل المستخدمين: '+error.message);return}
 profiles=(data||[]).filter(p=>!blocked.has(p.id));
 const {data:friends,error:friendsError}=await db.rpc('chat_my_relation_profiles');
 if(friendsError){setStatus('تعذّر تحميل طلبات الصداقة: '+friendsError.message);return}
 for(const p of friends||[])if(!blocked.has(p.id)&&!profiles.some(x=>x.id===p.id))profiles.push(p);
 await refreshPresence();render();await loadGroupInvitations();
}
async function refreshPresence(){
 const ids=profiles.map(p=>p.id).slice(0,50);if(!ids.length){presence=new Map();return}
 const {data,error}=await db.rpc('chat_get_presence',{p_users:ids});
 if(!error)presence=new Map((data||[]).map(x=>[x.user_id,x.is_online]));
}
function relationFor(id){return relations.find(r=>r.requester_id===id||r.addressee_id===id)}
function makeButton(label,action,secondary=false){const b=el('button',secondary?'secondary':'',label);b.type='button';b.addEventListener('click',action);return b}
function card(p,r){
 const state=presence.has(p.id)?(presence.get(p.id)?'online':'offline'):'unknown';const c=el('article','card'),av=el('div','avatar '+state,'👤'),info=el('div','person'),actions=el('div','actions');
 if(p.avatar_path){
  const img=el('img');img.alt='';
  const show=url=>{img.src=url;av.textContent='';av.append(img);img.onerror=()=>{av.textContent='👤'}};
  const cached=avatarCache.get(p.avatar_path);
  if(cached&&cached.expires>Date.now())show(cached.url);
  else db.storage.from('profile-avatars').createSignedUrl(p.avatar_path,900).then(({data,error})=>{
   if(!error&&data?.signedUrl){
    avatarCache.set(p.avatar_path,{url:data.signedUrl,expires:Date.now()+12*60*1000});show(data.signedUrl);
   }
  });
 }
 info.append(el('strong','',p.display_name||'مستخدم'),el('small','',state==='online'?'● متصل الآن':state==='offline'?'● غير متصل':'الحالة مخفية'));
 const action=async(fn,args)=>{
 for(const b of actions.querySelectorAll('button'))b.disabled=true;
 try{const {error}=await db.rpc(fn,args);if(error)throw error;await load();setStatus('تم تحديث الطلب بنجاح')}
 catch(e){setStatus(e.message||'تعذّر إكمال العملية');for(const b of actions.querySelectorAll('button'))b.disabled=false}
 };
 if(!r)actions.append(makeButton('إضافة صديق',()=>action('chat_send_friend_request',{p_other:p.id})));
 else if(r.status==='rejected')actions.append(makeButton('طلب مرفوض',()=>{},true));
 else if(r.status==='pending'&&r.requester_id===me)actions.append(makeButton('إلغاء الطلب',()=>action('chat_cancel_friend_request',{p_id:r.id}),true));
 else if(r.status==='pending'){actions.append(makeButton('قبول',()=>action('chat_respond_friend_request',{p_id:r.id,p_accept:true})),makeButton('رفض',()=>action('chat_respond_friend_request',{p_id:r.id,p_accept:false}),true))}
 else if(r.status==='accepted')actions.append(makeButton('إزالة صداقة',()=>{if(confirm('متأكد بدك تلغي الصداقة؟'))action('chat_remove_friend',{p_other:p.id})},true));
 av.title='عرض الملف الشخصي';av.style.cursor='pointer';av.addEventListener('click',()=>location.href='./profile.html?id='+encodeURIComponent(p.id));info.style.cursor='pointer';info.addEventListener('click',()=>location.href='./profile.html?id='+encodeURIComponent(p.id));c.append(av,info,actions);return c;
}
function render(){
 list.replaceChildren();
 document.querySelectorAll('[data-tab]').forEach(b=>{
  b.setAttribute('aria-selected',String(b.dataset.tab===tab));
  const count=relations.filter(r=>r.status==='pending'&&(b.dataset.tab==='incoming'?r.addressee_id===me:b.dataset.tab==='outgoing'?r.requester_id===me:false)).length;
  const base=b.dataset.label||b.textContent.replace(/\s*\(\d+\)$/,'');b.dataset.label=base;
  b.textContent=count?base+' ('+count+')':base;
 });
 const selected=profiles.filter(p=>{const r=relationFor(p.id);if(tab==='incoming')return r?.status==='pending'&&r.addressee_id===me;if(tab==='outgoing')return r?.status==='pending'&&r.requester_id===me;if(tab==='friends')return r?.status==='accepted';return !r||r.status==='rejected'});
 selected.forEach(p=>list.append(card(p,relationFor(p.id))));if(!groupPicker.hidden)renderGroupChoices();
}


async function loadGroupInvitations(){if(!me)return;const{data:members,error}=await db.from('chat_group_call_members').select('call_id,status').eq('user_id',me).in('status',['invited','joined']).limit(30);if(error)return;const ids=(members||[]).map(m=>m.call_id);const container=document.getElementById('groupIncoming');container.replaceChildren();if(!ids.length)return;const{data:calls}=await db.from('chat_group_calls').select('id,call_type,status').in('id',ids).neq('status','ended');for(const call of calls||[]){const m=members.find(x=>x.call_id===call.id);const item=el('div','group-choice');item.append(el('span','',call.call_type==='video'?'📹 دعوة فيديو جماعية':'📞 دعوة صوتية جماعية'));item.append(makeButton(m?.status==='invited'?'قبول والانضمام':'العودة للمكالمة',()=>location.href='./group-call.html?id='+encodeURIComponent(call.id)));if(m?.status==='invited')item.append(makeButton('رفض',async()=>{const{error}=await db.rpc('chat_respond_group_call',{p_call_id:call.id,p_action:'decline'});if(error)setStatus(error.message);else await loadGroupInvitations()},true));container.append(item)}}
const groupPicker=document.getElementById('groupPicker'),groupChoices=document.getElementById('groupFriendChoices');
document.getElementById('groupSelectFriends').addEventListener('click',()=>{groupPicker.hidden=!groupPicker.hidden;renderGroupChoices()});
function renderGroupChoices(){const chosen=new Set([...groupChoices.querySelectorAll('input:checked')].map(x=>x.value));groupChoices.replaceChildren();const friends=profiles.filter(p=>relationFor(p.id)?.status==='accepted');if(!friends.length){groupChoices.append(el('p','hint','ما عندك أصدقاء مقبولين بعد'));return}for(const p of friends){const label=el('label','group-choice'),checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.value=p.id;checkbox.checked=chosen.has(p.id);checkbox.addEventListener('change',()=>{const count=groupChoices.querySelectorAll('input:checked').length;if(count>7){checkbox.checked=false;document.getElementById('groupFeedback').textContent='الحد الأقصى 7 أصدقاء'}});label.append(checkbox,el('span','',p.display_name||'مستخدم'));groupChoices.append(label)}}
async function prepareGroupInvitation(type){const ids=[...groupChoices.querySelectorAll('input:checked')].map(x=>x.value),status=document.getElementById('groupFeedback');if(!ids.length){status.textContent='اختار صديق واحد على الأقل';return}const buttons=[document.getElementById('groupInviteAudio'),document.getElementById('groupInviteVideo')];buttons.forEach(b=>b.disabled=true);status.textContent='جارٍ تجهيز الدعوات...';try{const{data,error}=await db.rpc('chat_create_group_call',{p_type:type,p_invitees:ids});if(error)throw error;status.textContent='تم إرسال الدعوات. جارٍ فتح المكالمة...';location.href='./group-call.html?id='+encodeURIComponent(data)}catch(e){status.textContent='تعذّر تجهيز الدعوات: '+(e.message||'خطأ')}finally{buttons.forEach(b=>b.disabled=false)}}
document.getElementById('groupInviteAudio').addEventListener('click',()=>prepareGroupInvitation('audio'));
document.getElementById('groupInviteVideo').addEventListener('click',()=>prepareGroupInvitation('video'));

document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();refreshProfiles()});
document.getElementById('refreshFriends').addEventListener('click',load);
load();setInterval(()=>{if(!document.hidden&&me)loadGroupInvitations()},6000);
let heartbeatTimer=null,presenceTimer=null;
function startPresence(){if(heartbeatTimer)return;const beat=()=>{if(!document.hidden&&me)db.rpc('chat_presence_heartbeat').then(()=>{})};beat();heartbeatTimer=setInterval(beat,45000);presenceTimer=setInterval(async()=>{if(!document.hidden&&me){await refreshPresence();render()}},30000)}
// Heartbeat starts only after authentication succeeds.
const authWatcher=setInterval(()=>{if(me){clearInterval(authWatcher);startPresence()}},500);
window.addEventListener('focus',()=>{if(me)load()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me){db.rpc('chat_presence_heartbeat').then(()=>{});refreshPresence().then(render)}});
</script></body></html>
