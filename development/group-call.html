<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مكالمة جماعية | أبو علي شات</title><style>
:root{color-scheme:dark;font-family:system-ui,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 15%,#294f5b,#101523 65%);color:#f9e9c7}header{display:flex;align-items:center;justify-content:space-between;padding:18px;gap:10px}header a{color:#e8c68b;text-decoration:none}.stage{min-height:58dvh;padding:14px;display:flex;flex-direction:column;gap:18px}.status{text-align:center;font-size:15px;color:#c9e4df;min-height:24px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:800px;width:100%;margin:auto}.tile{position:relative;aspect-ratio:4/5;max-height:40dvh;background:linear-gradient(145deg,#34505d,#1a2935);border:1px solid #ffffff30;border-radius:22px;overflow:hidden;display:grid;place-items:center}.tile video{width:100%;height:100%;object-fit:cover}.tile .placeholder{font-size:50px}.tile .name{position:absolute;bottom:8px;right:8px;left:8px;padding:8px;background:#0b1119bb;border-radius:10px;font-size:13px}.tile .name span{float:left}.controls{position:sticky;bottom:0;background:#141c28f5;border-radius:28px 28px 0 0;padding:20px 12px calc(18px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center;flex-wrap:wrap;box-shadow:0 -12px 30px #0004}.controls button,.dialog button{border:0;border-radius:16px;min-height:52px;padding:12px 18px;background:#30404c;color:white;font-weight:700}.controls button[aria-pressed=true]{background:#d4b477;color:#1a1820}.controls .end{background:#d32d4e}.dialog{max-width:520px;margin:14px auto;padding:16px;border:1px solid #ffffff35;border-radius:20px;background:#192735}.dialog[hidden]{display:none}.dialog label{display:block;padding:8px}.dialog input{accent-color:#d4b477;width:20px;height:20px;vertical-align:middle;margin-inline-end:10px}.dialog button{margin:6px}button:disabled{opacity:.45}.small{font-size:12px;color:#b6c8c9;text-align:center;padding:12px}/* Mobile video calls: remote participant fills the stage; self preview stays in a corner. */
.tiles:has(>.tile.remote):has(>.tile.local){position:relative;display:flex;align-items:stretch;justify-content:center;min-height:min(62dvh,650px);max-width:900px}
.tiles:has(>.tile.remote):has(>.tile.local)>.tile.remote{flex:1;aspect-ratio:auto;max-height:none;min-height:min(62dvh,650px)}
.tiles:has(>.tile.remote):has(>.tile.local)>.tile.local{position:absolute;z-index:3;bottom:14px;left:14px;width:clamp(100px,26%,155px);height:clamp(145px,29dvh,210px);min-height:0;max-height:none;aspect-ratio:auto;box-shadow:0 8px 30px #000b;border:2px solid #e3c18a}
.tiles:has(>.tile.remote):has(>.tile.local)>.tile.local .name{font-size:11px;padding:5px}
.tiles:has(>.tile.remote):has(>.tile.local):has(>.tile.remote:nth-child(3)){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-height:0}
.tiles:has(>.tile.remote):has(>.tile.remote:nth-child(3))>.tile.remote{aspect-ratio:4/5;min-height:0;max-height:40dvh}
.tiles:has(>.tile.remote):has(>.tile.remote:nth-child(3))>.tile.local{position:relative;bottom:auto;left:auto;width:auto;height:auto;aspect-ratio:4/5;max-height:40dvh}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
@media(max-width:600px){.stage{padding:6px;gap:8px}.tiles:has(>.tile.remote):has(>.tile.local)>.tile.remote{border-radius:16px}.tiles:has(>.tile.remote):has(>.tile.local)>.tile.local{bottom:10px;left:10px;border-radius:14px}.controls{gap:6px;padding:12px 6px calc(10px + env(safe-area-inset-bottom))}.controls button{min-height:45px;padding:8px 10px;font-size:12px}}
</style><link rel="icon" type="image/svg+xml" href="./icon.svg"></head><body>
<header><a href="./friends.html">‹ الأصدقاء</a><strong id="title">مكالمة جماعية</strong><button id="inviteOpen" type="button">＋ إضافة صديق</button></header>
<main><section class="stage"><div id="status" class="status" role="status" aria-live="polite">جارٍ تجهيز المكالمة...</div><div id="tiles" class="tiles"></div></section><section class="dialog" id="inviteDialog" hidden><h3>دعوة أصدقاء جدد</h3><div id="friendList"></div><button id="inviteSend">إرسال الدعوات</button><button id="inviteClose">إغلاق</button></section><div class="small">المكالمات الجماعية تتطلب السماح للكاميرا والميكروفون. جودة الاتصال تعتمد على شبكة كل مشارك، وقد يلزم TURN لبعض الشبكات.</div></main>
<footer class="controls"><button id="mute" aria-pressed="false">🎙 كتم</button><button id="camera" aria-pressed="false">📷 كاميرا</button><button id="speaker">🔊 الصوت</button><button id="share">🖥 مشاركة الشاشة</button><button id="end" class="end">☎ إنهاء / مغادرة</button></footer>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://xgoggkcwmagghkdzvjqz.supabase.co','sb_publishable_MUJZT-WcsKGC3JH3IwtJSA_9jZOnhsT',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id),callId=new URLSearchParams(location.search).get('id');let me,call,stream,ended=false,cursor=0,busy=false,timer=null,screenTrack=null;const peers=new Map(),names=new Map(),pending=new Map();const status=message=>$('status').textContent=message;
async function getWebRtcRoute(pc){try{const stats=await pc.getStats();let route='غير معروف';for(const item of stats.values()){if(item.type==='candidate-pair'&&(item.selected||item.nominated)&&item.state==='succeeded'){const local=stats.get(item.localCandidateId);if(local?.candidateType==='relay')return 'TURN (relay)';if(local?.candidateType==='srflx')route='STUN (srflx)';else if(local?.candidateType==='host'&&route==='غير معروف')route='اتصال مباشر'}}return route}catch(e){return 'غير معروف'}}
async function getCallIceServers(){const fallback=[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}];try{const {data:{session}}=await db.auth.getSession();if(!session?.access_token)return fallback;const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),3500);try{const response=await fetch('https://xgoggkcwmagghkdzvjqz.supabase.co/functions/v1/chat-turn-credentials',{headers:{Authorization:'Bearer '+session.access_token,apikey:'sb_publishable_MUJZT-WcsKGC3JH3IwtJSA_9jZOnhsT'},signal:controller.signal});if(!response.ok)return fallback;const data=await response.json();const servers=(data.iceServers||[]).filter(x=>x&&((typeof x.urls==='string'&&/^turns?:|^stuns?:/.test(x.urls))||(Array.isArray(x.urls)&&x.urls.some(y=>/^turns?:|^stuns?:/.test(y)))));return servers.length?[...fallback,...servers]:fallback}finally{clearTimeout(timeout)}}catch(e){return fallback}}

function tile(id,name,local=false){let node=document.getElementById('tile-'+id);if(node)return node;node=document.createElement('div');node.className='tile '+(local?'local':'remote');node.id='tile-'+id;const icon=document.createElement('span');icon.className='placeholder';icon.textContent='👤';const caption=document.createElement('div');caption.className='name';caption.textContent=name+(local?' (أنت)':'');node.append(icon,caption);$('tiles').append(node);return node}
function showVideo(id,media,local=false){const node=tile(id,names.get(id)||'مشارك',local);let video=node.querySelector('video');if(!video){video=document.createElement('video');video.autoplay=true;video.playsInline=true;video.muted=local;node.prepend(video)}video.srcObject=media;const hasVideo=media.getVideoTracks().length>0;video.hidden=!hasVideo;const placeholder=node.querySelector('.placeholder');if(placeholder)placeholder.hidden=hasVideo;video.play().catch(()=>{if(!local){status('اضغط على الشاشة للسماح بتشغيل صوت المشاركين');document.body.addEventListener('click',()=>video.play().catch(()=>{}),{once:true})}})}
function removePeer(id){const p=peers.get(id);if(p){p.pc.close();p.remote.getTracks().forEach(t=>t.stop());peers.delete(id)}document.getElementById('tile-'+id)?.remove()}
async function signal(to,type,payload){const{error}=await db.rpc('chat_send_group_signal',{p_call_id:callId,p_recipient:to,p_type:type,p_payload:payload});if(error)throw error}
async function connect(id){if(peers.has(id)||ended)return;const pc=new RTCPeerConnection({iceServers:await getCallIceServers(),iceCandidatePoolSize:4});const peer={pc,remote:new MediaStream(),ice:[],offered:false};peers.set(id,peer);for(const track of stream.getTracks()){
  if(track.kind==='video'&&screenTrack?.readyState==='live'){
    const sender=pc.addTrack(screenTrack,new MediaStream([screenTrack]));
    sender._abualiScreenShare=true;
  }else pc.addTrack(track,stream);
}
if(screenTrack?.readyState==='live'&&!stream.getVideoTracks().length){
  const sender=pc.addTrack(screenTrack,new MediaStream([screenTrack]));
  sender._abualiScreenShare=true;
}
pc.ontrack=e=>{if(!peer.remote.getTracks().some(t=>t.id===e.track.id))peer.remote.addTrack(e.track);showVideo(id,peer.remote)};
pc.onicecandidate=e=>{if(e.candidate)signal(id,'ice',e.candidate.toJSON()).catch(err=>status('تعذّر إرسال بيانات الشبكة: '+err.message))};
pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')status('تعذّر الاتصال بأحد المشاركين. قد تحتاج الشبكة إلى TURN.');if(pc.connectionState==='connected')getWebRtcRoute(pc).then(route=>{peer.route=route;status('المكالمة متصلة • مسار '+route)})};
if(me<id){peer.offered=true;const offer=await pc.createOffer();await pc.setLocalDescription(offer);await signal(id,'offer',{type:pc.localDescription.type,sdp:pc.localDescription.sdp})}}
async function handleSignal(s){if(s.sender_id===me)return;const id=s.sender_id;if(!peers.has(id))await connect(id);const peer=peers.get(id);if(!peer)return;const pc=peer.pc;
if(s.signal_type==='offer'){if(pc.signalingState!=='stable')return;await pc.setRemoteDescription(s.payload);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await signal(id,'answer',{type:pc.localDescription.type,sdp:pc.localDescription.sdp})}
else if(s.signal_type==='answer'){if(pc.signalingState==='have-local-offer')await pc.setRemoteDescription(s.payload)}
else if(s.signal_type==='ice'){if(pc.remoteDescription)await pc.addIceCandidate(s.payload).catch(()=>{});else peer.ice.push(s.payload)}
if(pc.remoteDescription&&peer.ice.length){for(const ice of peer.ice.splice(0))await pc.addIceCandidate(ice).catch(()=>{})}}
async function poll(){if(busy||ended)return;busy=true;try{const [{data:group,error:groupError},{data:members,error:memberError},{data:signals,error:signalError}]=await Promise.all([db.from('chat_group_calls').select('*').eq('id',callId).single(),db.from('chat_group_call_members').select('user_id,status').eq('call_id',callId),db.from('chat_group_call_signals').select('id,sender_id,signal_type,payload').eq('call_id',callId).gt('id',cursor).order('id').limit(200)]);if(groupError||memberError||signalError)throw groupError||memberError||signalError;
if(group.status==='ended'){await finish(false);status('انتهت المكالمة');return}const mine=members.find(m=>m.user_id===me);if(!mine||mine.status!=='joined'){await finish(false);status('غادرت المكالمة');return}
const joined=new Set(members.filter(m=>m.status==='joined').map(m=>m.user_id));for(const id of [...peers.keys()])if(!joined.has(id))removePeer(id);
for(const m of members){if(m.user_id!==me&&m.status==='joined'&&!peers.has(m.user_id))await connect(m.user_id)}
for(const s of signals){try{await handleSignal(s)}catch(e){status('خطأ في ربط مشارك: '+e.message)}cursor=s.id}
status('متصلون: '+joined.size+' / 8'+(members.some(m=>m.status==='invited')?' • بانتظار قبول الدعوات':''));
}catch(e){status('تعذّر تحديث المكالمة: '+e.message)}finally{busy=false}}
async function finish(update=true){if(ended)return;ended=true;clearInterval(timer);for(const id of [...peers.keys()])removePeer(id);screenTrack?.stop();$('share').disabled=true;stream?.getTracks().forEach(t=>t.stop());if(update&&call){await db.rpc('chat_respond_group_call',{p_call_id:callId,p_action:call.host_id===me?'end':'leave'}).catch(()=>{})}$('end').disabled=true}
$('end').onclick=async()=>{await finish();location.href='./friends.html'};
$('mute').onclick=()=>{const t=stream?.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;$('mute').setAttribute('aria-pressed',String(!t.enabled))};
$('camera').onclick=()=>{const t=stream?.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;$('camera').setAttribute('aria-pressed',String(!t.enabled))};
$('speaker').onclick=()=>status('توجيه الصوت إلى سماعة الأذن أو المكبر يعتمد على دعم المتصفح وإعدادات الجهاز');
async function restoreCameraAfterShare(){
  if(ended)return;
  const camera=stream?.getVideoTracks()[0]||null;
  for(const [id,p] of peers){
    const sender=p.pc.getSenders().find(s=>s.track?.kind==='video'||s._abualiScreenShare===true);
    if(!sender)continue;
    try{await sender.replaceTrack(camera);sender._abualiScreenShare=false}catch(e){status('تعذّر استعادة الكاميرا: '+e.message)}
  }
  if(stream)showVideo(me,stream,true);
  $('share').textContent='🖥 مشاركة الشاشة';
  $('share').setAttribute('aria-pressed','false');
}
$('share').onclick=async()=>{if($('share').disabled||ended)return;$('share').disabled=true;try{if(screenTrack){const previous=screenTrack;screenTrack=null;previous.stop();await restoreCameraAfterShare();return}if(!navigator.mediaDevices?.getDisplayMedia){status('مشاركة الشاشة غير متاحة من هذا المتصفح؛ جرّب متصفح كمبيوتر حديث');return}try{const display=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});const track=display.getVideoTracks()[0];if(ended){track.stop();return}screenTrack=track;track.onended=async()=>{if(screenTrack!==track||ended)return;screenTrack=null;await restoreCameraAfterShare()};for(const [id,p] of peers){const sender=p.pc.getSenders().find(s=>s.track?.kind==='video'||s._abualiScreenShare===true);if(sender){await sender.replaceTrack(track);sender._abualiScreenShare=true}else{const newSender=p.pc.addTrack(track,display);newSender._abualiScreenShare=true;if(p.pc.signalingState==='stable'){const offer=await p.pc.createOffer();await p.pc.setLocalDescription(offer);await signal(id,'offer',{type:p.pc.localDescription.type,sdp:p.pc.localDescription.sdp})}}}showVideo(me,display,true);$('share').textContent='⏹ إيقاف المشاركة';$('share').setAttribute('aria-pressed','true');status('بدأت مشاركة الشاشة')}catch(e){if(screenTrack){const failed=screenTrack;screenTrack=null;failed.stop();await restoreCameraAfterShare()}status('تعذّرت مشاركة الشاشة: '+e.message)}}finally{if(!ended)$('share').disabled=false}};
$('inviteOpen').onclick=async()=>{$('inviteDialog').hidden=false;const{data,error}=await db.rpc('chat_my_relation_profiles');if(error){status(error.message);return}const{data:members}=await db.from('chat_group_call_members').select('user_id').eq('call_id',callId);const existing=new Set((members||[]).map(m=>m.user_id));$('friendList').replaceChildren();for(const p of data||[]){if(existing.has(p.id))continue;const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.value=p.id;label.append(check,document.createTextNode(p.display_name||'صديق'));$('friendList').append(label)}};
$('inviteClose').onclick=()=>$('inviteDialog').hidden=true;
$('inviteSend').onclick=async()=>{const ids=[...$('friendList').querySelectorAll('input:checked')].map(x=>x.value);$('inviteSend').disabled=true;try{for(const id of ids){const{error}=await db.rpc('chat_invite_group_friend',{p_call_id:callId,p_friend:id});if(error)throw error}status('تم إرسال الدعوات');$('inviteDialog').hidden=true}catch(e){status('تعذّرت الدعوة: '+e.message)}finally{$('inviteSend').disabled=false}};
async function start(){try{if(!callId)throw Error('رابط المكالمة غير صالح');const{data:{user},error:authError}=await db.auth.getUser();if(authError||!user)throw Error('سجّل الدخول أولاً');me=user.id;const{data:group,error}=await db.from('chat_group_calls').select('*').eq('id',callId).single();if(error||!group)throw Error('المكالمة غير موجودة أو ليس لديك صلاحية');call=group;$('title').textContent=group.call_type==='video'?'📹 مكالمة فيديو جماعية':'📞 مكالمة صوتية جماعية';const{data:members}=await db.from('chat_group_call_members').select('user_id,status').eq('call_id',callId);const mine=members?.find(m=>m.user_id===me);if(!mine)throw Error('أنت غير مدعو');if(mine.status==='invited'){if(!confirm('هل تريد الانضمام إلى المكالمة الجماعية؟')){await db.rpc('chat_respond_group_call',{p_call_id:callId,p_action:'decline'});location.href='./friends.html';return}const{error:joinError}=await db.rpc('chat_respond_group_call',{p_call_id:callId,p_action:'join'});if(joinError)throw joinError}else if(mine.status!=='joined')throw Error('هذه الدعوة لم تعد متاحة');
try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:group.call_type==='video'?{facingMode:'user'}:false})}catch(mediaError){await db.rpc('chat_respond_group_call',{p_call_id:callId,p_action:call.host_id===me?'end':'leave'}).catch(()=>{});throw mediaError}names.set(me,'أنت');showVideo(me,stream,true);$('camera').hidden=group.call_type!=='video';await poll();timer=setInterval(poll,1600);
}catch(e){status('تعذّر تشغيل المكالمة: '+e.message)}}
window.addEventListener('pagehide',()=>{if(!ended){stream?.getTracks().forEach(t=>t.stop());screenTrack?.stop();for(const p of peers.values())p.pc.close();if(call&&me){db.auth.getSession().then(({data:{session}})=>{if(!session?.access_token)return;fetch('https://xgoggkcwmagghkdzvjqz.supabase.co/rest/v1/rpc/chat_respond_group_call',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','apikey':'sb_publishable_MUJZT-WcsKGC3JH3IwtJSA_9jZOnhsT','Authorization':'Bearer '+session.access_token},body:JSON.stringify({p_call_id:callId,p_action:call.host_id===me?'end':'leave'})}).catch(()=>{})}).catch(()=>{})}}});start();
</script></body></html>
