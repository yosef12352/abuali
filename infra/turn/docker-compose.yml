services:
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_REALM: ${TURN_REALM:?set TURN_REALM}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?set TURN_SHARED_SECRET}
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:?set TURN_PUBLIC_IP}
    entrypoint: ["/bin/sh","-ec"]
    command: |
      exec turnserver --no-cli --no-tls --no-dtls --fingerprint --lt-cred-mech --use-auth-secret \
        --static-auth-secret "$$TURN_SHARED_SECRET" --realm "$$TURN_REALM" \
        --external-ip "$$TURN_PUBLIC_IP" --listening-port 3478 \
        --min-port 49160 --max-port 49260 --verbose
