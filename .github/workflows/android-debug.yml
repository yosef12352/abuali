name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [feature/social-foundation-v1]
    paths: ['development/**','android-native/**','.github/workflows/android-debug.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
        working-directory: android-native
      - run: node build-android.mjs
        working-directory: android-native
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android-native/android
      - uses: actions/upload-artifact@v4
        with:
          name: abu-ali-chat-debug-apk
          path: android-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
