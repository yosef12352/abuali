name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [feature/social-foundation-v1]
    paths: ['development/**','android-native/**','.github/workflows/android-debug.yml']
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          echo "Using preinstalled Android SDK: $ANDROID_HOME"
      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund
        working-directory: android-native
      - name: Syntax-check application JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inline = []
                  self.collect = False
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      attributes = dict(attrs)
                      self.collect = 'src' not in attributes and attributes.get('type', '').lower() != 'application/ld+json'
              def handle_data(self, data):
                  if self.collect:
                      self.inline.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.collect = False

          with tempfile.TemporaryDirectory() as tmp:
              checked = 0
              for page in sorted(Path('development').glob('*.html')):
                  parser = Scripts()
                  parser.feed(page.read_text(encoding='utf-8'))
                  for i, script in enumerate(parser.inline):
                      if not script.strip():
                          continue
                      candidate = Path(tmp) / f'{page.stem}-{i}.mjs'
                      candidate.write_text(script, encoding='utf-8')
                      subprocess.run(['node', '--check', str(candidate)], check=True)
                      checked += 1
              assert checked > 0, 'No inline application scripts found'
              print(f'Syntax-checked {checked} inline scripts')
          PY
          node --check android-native/build-android.mjs
      - name: Generate Android project
        run: node build-android.mjs
        working-directory: android-native
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      - name: Verify Firebase configuration when supplied
        shell: bash
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            test -s android-native/android/app/google-services.json
            grep -q 'com.google.gms.google-services' android-native/android/app/build.gradle
            grep -q 'com.google.gms:google-services:' android-native/android/build.gradle
            echo 'Firebase Android configuration verified'
          else
            echo 'Firebase not configured; this APK will not receive FCM push messages'
          fi
      - name: Verify native call plugin and permissions
        shell: bash
        run: |
          set -euo pipefail
          test -s android-native/android/app/src/main/java/com/abualichat/audio/CallAudioPlugin.java
          grep -q 'registerPlugin(CallAudioPlugin.class)' android-native/android/app/src/main/java/com/abualichat/app/MainActivity.java
          for permission in INTERNET CAMERA RECORD_AUDIO MODIFY_AUDIO_SETTINGS WAKE_LOCK POST_NOTIFICATIONS; do
            grep -q "android.permission.${permission}" android-native/android/app/src/main/AndroidManifest.xml
          done
      - name: Verify original app icon and adaptive launcher resources
        shell: bash
        run: |
          set -euo pipefail
          res=android-native/android/app/src/main/res
          test -s "$res/drawable-nodpi/abuali_original_logo.jpg"
          file "$res/drawable-nodpi/abuali_original_logo.jpg" | grep -q 'JPEG image data'
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          base = Path('android-native/android/app/src/main')
          manifest = ET.parse(base / 'AndroidManifest.xml').getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          app = manifest.find('application')
          assert app is not None
          assert app.get(android + 'icon') == '@mipmap/ic_launcher'
          assert app.get(android + 'roundIcon') == '@mipmap/ic_launcher_round'
          for name in ('ic_launcher', 'ic_launcher_round'):
              root = ET.parse(base / 'res/mipmap-anydpi-v26' / (name + '.xml')).getroot()
              assert root.tag == 'adaptive-icon'
              assert root.find('foreground').get(android + 'drawable') == '@drawable/abuali_original_logo'
          print('Original Android launcher icons and manifest verified')
          PY
      - name: Verify native audio routing and proximity integration
        shell: bash
        run: |
          set -euo pipefail
          plugin=android-native/android/app/src/main/java/com/abualichat/audio/CallAudioPlugin.java
          main=android-native/android/app/src/main/java/com/abualichat/app/MainActivity.java
          test -s "$plugin"
          grep -q 'registerPlugin(CallAudioPlugin.class)' "$main"
          grep -q 'AudioManager.MODE_IN_COMMUNICATION' "$plugin"
          grep -q 'setCommunicationDevice' "$plugin"
          grep -q 'isWakeLockLevelSupported' "$plugin"
          grep -q 'proximityLock.release()' "$plugin"
          grep -q 'handleOnDestroy' "$plugin"
          echo 'Native call audio and proximity integration verified statically'
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android-native/android
      - name: Verify APK package and installable metadata
        shell: bash
        run: |
          set -euo pipefail
          apk=android-native/android/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          "$aapt" dump badging "$apk" | tee /tmp/abuali-apk-badging.txt
          grep -q "package: name='com.abualichat.app'" /tmp/abuali-apk-badging.txt
          grep -q 'sdkVersion:' /tmp/abuali-apk-badging.txt
          grep -q 'application-label:' /tmp/abuali-apk-badging.txt
          echo 'Android package identity and APK metadata verified'
      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          apk=android-native/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          sha256sum "$apk"
          ls -lh "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: abu-ali-chat-debug-apk
          path: android-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
